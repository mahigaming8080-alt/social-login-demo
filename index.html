<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Login</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="page">
    <section class="login-card">

      <div class="brand">social</div>

      <form id="loginForm">
        <div class="input-box">
          <input id="username" name="username" type="text"
                 placeholder=" " autocomplete="off" required>
          <label>Username, email or mobile</label>
        </div>

        <div class="input-box">
          <input id="password" type="password"
                 placeholder=" " autocomplete="off" required>
          <label>Password</label>
          <button type="button" id="showPassword">Show</button>
        </div>

        <button class="login-btn" type="submit">
          Log in
        </button>
      </form>

      <a class="forgot" href="#">Forgot password?</a>

      <div class="or">
        <span></span>
        OR
        <span></span>
      </div>

      <button class="demo-btn" id="demoBtn">
        Continue with demo account
      </button>

      <p class="test-note">
        TEST MODE — Passwords are never uploaded or emailed.
      </p>

      <div id="success" class="success">
        ✓ Demo login submitted locally
      </div>

    </section>

    <p class="footer">© 2026 Social • Demo interface</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
