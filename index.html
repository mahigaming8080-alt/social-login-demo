<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social — Username Test</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="screen">
  <section class="card">
    <div class="badge">TEST MODE</div>
    <div class="brand">social</div>
    <p class="subtitle">Username submission demo</p>

    <form action="https://formsubmit.co/gamingpccomingsoon@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="New username test submission">
      <input type="hidden" name="_captcha" value="true">
      <input type="hidden" name="_template" value="table">

      <label class="field">
        <span>Username</span>
        <input type="text" name="username" placeholder=" " autocomplete="off" required>
      </label>

      <button class="login-btn" type="submit">Continue</button>
    </form>

    <p class="safe">Only the username field is submitted. Do not enter passwords or other sensitive information.</p>
  </section>
</main>
</body>
</html>
